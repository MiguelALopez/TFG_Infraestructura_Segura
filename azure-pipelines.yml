trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - .gitignore

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: TFG-Variables
  - name: terraformVersion
    value: '1.6.0'
  - name: azureServiceConnection
    value: 'Azure-ServiceConnection-TFG'
  - name: terraformWorkingDirectory
    value: '$(System.DefaultWorkingDirectory)/terraform'
  - name: ansibleWorkingDirectory
    value: '$(System.DefaultWorkingDirectory)/ansible'

stages:
  # ========================================
  # STAGE 1: VALIDACIÓN Y SEGURIDAD
  # ========================================
  - stage: Validation
    displayName: 'Validación y Auditoría de Seguridad'
    jobs:
      - job: SecurityAudit
        displayName: 'Auditoría de Seguridad'
        steps:
          - checkout: self
            displayName: 'Checkout del repositorio'

          - script: |
              echo "Verificando que no haya archivos sensibles en el repositorio..."
              SENSITIVE_FILES=$(git ls-files | grep -E "(\.tfvars|\.tfstate|hosts\.ini|\.env)$" || true)
              if [ -n "$SENSITIVE_FILES" ]; then
                echo "ERROR: Archivos sensibles detectados en el repositorio:"
                echo "$SENSITIVE_FILES"
                exit 1
              fi
              echo "OK: No se encontraron archivos sensibles en Git"
            displayName: 'Verificar .gitignore compliance'

          - script: |
              echo "Buscando contraseñas hardcodeadas..."
              HARDCODED=$(grep -rn --include="*.tf" --include="*.yml" "password.*=.*['\"]" . || true)
              if [ -n "$HARDCODED" ]; then
                echo "ADVERTENCIA: Posibles contraseñas hardcodeadas detectadas"
                echo "$HARDCODED"
              else
                echo "OK: No se detectaron contraseñas hardcodeadas"
              fi
            displayName: 'Escaneo de credenciales hardcodeadas'
            continueOnError: 'true'

      - job: TerraformValidation
        displayName: 'Validación de Terraform'
        dependsOn: SecurityAudit
        steps:
          - script: |
              wget -q https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
              unzip -q terraform_$(terraformVersion)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: 'Instalar Terraform'

          - script: |
              cd $(terraformWorkingDirectory)
              terraform fmt -check -recursive
            displayName: 'Verificar formato de Terraform'
            continueOnError: 'true'

          - task: AzureCLI@2
            displayName: 'Terraform Init y Validate'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: $(terraformWorkingDirectory)
              inlineScript: |
                terraform init -backend=false
                terraform validate

      - job: AnsibleValidation
        displayName: 'Validación de Ansible'
        dependsOn: SecurityAudit
        steps:
          - script: |
              sudo apt-get update -q
              sudo apt-get install -y -q ansible
            displayName: 'Instalar Ansible'

          - script: |
              cd $(ansibleWorkingDirectory)
              ansible-playbook site.yml --syntax-check
            displayName: 'Verificar sintaxis de Ansible'

  # ========================================
  # STAGE 2: TERRAFORM PLAN
  # ========================================
  - stage: TerraformPlan
    displayName: 'Terraform Plan (Preview de Cambios)'
    dependsOn: Validation
    condition: succeeded()
    jobs:
      - job: Plan
        displayName: 'Generar Plan de Terraform'
        steps:
          - script: |
              wget -q https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
              unzip -q terraform_$(terraformVersion)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: 'Instalar Terraform'

          - task: AzureCLI@2
            displayName: 'Terraform Init'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: $(terraformWorkingDirectory)
              inlineScript: |
                terraform init

          - task: AzureCLI@2
            displayName: 'Terraform Plan'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: $(terraformWorkingDirectory)
              inlineScript: |
                terraform plan \
                  -var="admin_username=$(TF_VAR_admin_username)" \
                  -var="ssh_public_key=$(TF_VAR_ssh_public_key)" \
                  -var="location=$(TF_VAR_location)" \
                  -var="db_admin_user=$(TF_VAR_db_admin_user)" \
                  -var="db_password=$(TF_VAR_db_password)" \
                  -out=tfplan

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar Plan de Terraform'
            inputs:
              targetPath: '$(terraformWorkingDirectory)/tfplan'
              artifact: 'terraform-plan'
              publishLocation: 'pipeline'

  # ========================================
  # STAGE 3: TERRAFORM APPLY (CON APROBACIÓN MANUAL)
  # ========================================
  - stage: TerraformApply
    displayName: 'Terraform Apply (Despliegue de Infraestructura)'
    dependsOn: TerraformPlan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyInfrastructure
        displayName: 'Aplicar Cambios de Infraestructura'
        environment: 'production-azure'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    wget -q https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
                    unzip -q terraform_$(terraformVersion)_linux_amd64.zip
                    sudo mv terraform /usr/local/bin/
                  displayName: 'Instalar Terraform'

                - task: DownloadPipelineArtifact@2
                  displayName: 'Descargar Plan de Terraform'
                  inputs:
                    artifactName: 'terraform-plan'
                    targetPath: '$(terraformWorkingDirectory)'

                - task: AzureCLI@2
                  displayName: 'Terraform Init'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    workingDirectory: $(terraformWorkingDirectory)
                    inlineScript: |
                      terraform init

                - task: AzureCLI@2
                  displayName: 'Terraform Apply'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    workingDirectory: $(terraformWorkingDirectory)
                    inlineScript: |
                      terraform apply -auto-approve tfplan

                - task: AzureCLI@2
                  displayName: 'Capturar Outputs de Terraform'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    workingDirectory: $(terraformWorkingDirectory)
                    inlineScript: |
                      echo "Extrayendo outputs de Terraform..."
                      PUBLIC_IP=$(terraform output -raw lb_public_ip)
                      KEYVAULT_URI=$(terraform output -raw key_vault_uri)
                      echo "##vso[task.setvariable variable=PUBLIC_IP;isOutput=true]$PUBLIC_IP"
                      echo "##vso[task.setvariable variable=KEYVAULT_URI;isOutput=true]$KEYVAULT_URI"
                      echo "IP Publica Load Balancer: $PUBLIC_IP"
                      echo "Key Vault URI: $KEYVAULT_URI"

  # ========================================
  # STAGE 4: CONFIGURACIÓN CON ANSIBLE
  # ========================================
  - stage: AnsibleDeploy
    displayName: 'Configuración y Despliegue con Ansible'
    dependsOn: TerraformApply
    condition: succeeded()
    jobs:
      - job: ConfigureServers
        displayName: 'Configurar Servidores con Ansible'
        steps:
          - script: |
              sudo apt-get update -q
              sudo apt-get install -y -q ansible python3-pip
              pip3 install azure-cli azure-keyvault-secrets
              ansible-galaxy collection install azure.azcollection --force
            displayName: 'Instalar Ansible y dependencias de Azure'

          - task: AzureCLI@2
            displayName: 'Generar inventario dinámico desde Azure'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: $(ansibleWorkingDirectory)
              inlineScript: |
                VM1_IP=$(az vm show -d -g rg-tfg-micky-wordpress -n vm-wordpress-prod-1 --query publicIps -o tsv)
                VM2_IP=$(az vm show -d -g rg-tfg-micky-wordpress -n vm-wordpress-prod-2 --query publicIps -o tsv)
                cat > inventory/hosts.ini << EOF
                [wordpress_servers]
                vm-prod-1 ansible_host=$VM1_IP ansible_user=$(ANSIBLE_USER) ansible_ssh_private_key_file=${SSH_KEY_PATH}
                vm-prod-2 ansible_host=$VM2_IP ansible_user=$(ANSIBLE_USER) ansible_ssh_private_key_file=${SSH_KEY_PATH}

                [all:vars]
                ansible_python_interpreter=/usr/bin/python3
                EOF
                echo "Inventario generado:"
                cat inventory/hosts.ini

          - task: DownloadSecureFile@1
            displayName: 'Descargar clave SSH privada'
            name: sshKey
            inputs:
              secureFile: 'ansible_id_rsa'

          - task: AzureCLI@2
            displayName: 'Ejecutar Ansible Playbook'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: $(ansibleWorkingDirectory)
              inlineScript: |
                chmod 600 $(sshKey.secureFilePath)
                ansible-playbook \
                  -i inventory/hosts.ini \
                  site.yml \
                  --private-key=$(sshKey.secureFilePath) \
                  -e "azure_keyvault_uri=$(KEYVAULT_URI)" \
                  -e "azure_keyvault_secret_name=wp-db-password"

  # ========================================
  # STAGE 5: VERIFICACIÓN POST-DESPLIEGUE
  # ========================================
  - stage: PostDeploymentTests
    displayName: 'Verificación Post-Despliegue'
    dependsOn: AnsibleDeploy
    condition: succeeded()
    jobs:
      - job: HealthCheck
        displayName: 'Health Check de la Aplicación'
        steps:
          - script: |
              echo "Verificando accesibilidad del Load Balancer..."
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$(PUBLIC_IP) || echo "000")
              if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ]; then
                echo "OK: Aplicacion accesible (HTTP $HTTP_STATUS)"
              else
                echo "ERROR: Aplicacion no responde correctamente (HTTP $HTTP_STATUS)"
                exit 1
              fi
            displayName: 'Verificar acceso HTTP al Load Balancer'
            continueOnError: 'true'

          - script: |
              echo "Resumen del Despliegue:"
              echo "========================================"
              echo "IP Load Balancer: $(PUBLIC_IP)"
              echo "Key Vault URI:    $(KEYVAULT_URI)"
              echo "Stack:            WordPress + Nginx + Azure MySQL"
              echo "VMs:              vm-wordpress-prod-1 + vm-wordpress-prod-2"
              echo "Pipeline:         Completada exitosamente"
              echo "========================================"
            displayName: 'Resumen del Despliegue'
